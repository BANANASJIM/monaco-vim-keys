<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Monaco Vim Keys Settings</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <h1>Editor Settings</h1>
  <label class="row">
    <input type="checkbox" id="vimEnabled" />
    <span>Vim key bindings</span>
  </label>
  <label class="row">
    <input type="checkbox" id="relativeLineNumbers" />
    <span>Relative line numbers</span>
  </label>

  <h1>Sites</h1>
  <div id="sites"></div>

  <p class="note">Changes apply instantly to open tabs.</p>
  <script src="popup.js"></script>
</body>
</html>
